<!-- Hoja inferior "Más" -->
@if (sheetOpen()) {
  <div class="fixed inset-0 z-50 md:hidden bg-black/40 backdrop-blur-xs" (click)="closeSheet()">
    <div
      class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-2xl p-2 pb-[calc(env(safe-area-inset-bottom)+0.5rem)] animate-slide-up"
      (click)="$event.stopPropagation()"
    >
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-2"></div>
      <div class="py-1">
        @for (item of masItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="text-primary-700 bg-primary-50"
            (click)="closeSheet()"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 transition-colors text-sm font-medium"
          >
            <lucide-icon [name]="item.icon" [size]="20" class="shrink-0 text-slate-400" />
            {{ item.label }}
          </a>
        }

        @if (isSuperAdmin()) {
          <a
            routerLink="/admin"
            routerLinkActive="text-primary-700 bg-primary-50"
            (click)="closeSheet()"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 transition-colors text-sm font-medium"
          >
            <lucide-icon name="lock" [size]="20" class="shrink-0 text-slate-400" />
            Administración
          </a>
        }

        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 transition-colors text-sm font-medium"
        >
          <lucide-icon name="log-out" [size]="20" class="shrink-0" />
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
}

<!-- Navegación inferior — solo visible en móvil (md:hidden) -->
<nav
  class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 md:hidden"
  style="padding-bottom: env(safe-area-inset-bottom)"
  aria-label="Navegación principal"
>
  <div class="flex items-center justify-around h-16">
    <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="text-primary-600"
       class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-primary-600 transition-colors px-2 py-2 min-w-[56px] min-h-10">
      <lucide-icon name="layout-dashboard" [size]="24" />
      <span class="text-xs font-medium">Inicio</span>
    </a>

    <a routerLink="/citas" routerLinkActive="text-primary-600"
       class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-primary-600 transition-colors px-2 py-2 min-w-[56px] min-h-10">
      <lucide-icon name="calendar-days" [size]="24" />
      <span class="text-xs font-medium">Agenda</span>
    </a>

    <a routerLink="/pacientes" routerLinkActive="text-primary-600"
       class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-primary-600 transition-colors px-2 py-2 min-w-[56px] min-h-10">
      <lucide-icon name="users" [size]="24" />
      <span class="text-xs font-medium">Pacientes</span>
    </a>

    <a routerLink="/historial" routerLinkActive="text-primary-600"
       class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-primary-600 transition-colors px-2 py-2 min-w-[56px] min-h-10">
      <lucide-icon name="file-text" [size]="24" />
      <span class="text-xs font-medium">Historial</span>
    </a>

    <!-- Más: abre la hoja con el resto de secciones -->
    <button type="button" (click)="toggleSheet()"
       [class.text-primary-600]="sheetOpen()"
       [attr.aria-expanded]="sheetOpen()"
       class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-primary-600 transition-colors px-2 py-2 min-w-[56px] min-h-10">
      <lucide-icon name="more-horizontal" [size]="24" />
      <span class="text-xs font-medium">Más</span>
    </button>
  </div>
</nav>
