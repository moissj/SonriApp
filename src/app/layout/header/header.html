<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
  <div class="flex items-center justify-between gap-3 px-4 py-1.5 max-w-screen-xl mx-auto">
    <!-- Logo visible solo en móvil (en desktop lo muestra el sidenav) -->
    <div class="flex items-center gap-2 md:hidden">
      <img src="icons/icon-48.png" alt="SonriApp" class="h-7 w-7 object-contain" />
      <span class="font-bold text-xl text-primary-700 tracking-tight">SonriApp</span>
    </div>

    <div class="hidden md:flex items-center gap-3 min-w-0">
      <!-- Colapsa el menú lateral a modo rail -->
      <button
        type="button"
        (click)="toggleSidenav()"
        class="min-h-8 min-w-8 inline-flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-primary-600 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
        [attr.aria-pressed]="sidenavCollapsed()"
        [attr.aria-label]="sidenavCollapsed() ? 'Expandir menú lateral' : 'Colapsar menú lateral'"
      >
        <lucide-icon name="menu" [size]="20" />
      </button>
      <!-- Breadcrumb -->
      <nav aria-label="Ruta de navegación">
        <ol class="flex items-center gap-1.5 text-sm text-slate-500">
          @if (esRaiz()) {
            <li class="font-medium text-slate-900" aria-current="page">Inicio</li>
          } @else {
            <li><a routerLink="/" class="hover:text-primary-600">Inicio</a></li>
            <li aria-hidden="true"><lucide-icon name="chevron-right" [size]="14" /></li>
            <li class="font-medium text-slate-900 truncate" aria-current="page">{{ pageTitle() }}</li>
          }
        </ol>
      </nav>
    </div>

    <!-- Acciones -->
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="relative min-h-8 min-w-8 inline-flex items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 hover:text-primary-600 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
        aria-label="Notificaciones"
      >
        <lucide-icon name="bell" [size]="20" />
        @if (hayNoLeidas()) {
          <span class="absolute top-2 right-2 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
        }
      </button>

      <!-- Menú avatar -->
      <div class="relative" (click)="$event.stopPropagation()">
        <button
          type="button"
          (click)="toggleMenu($event)"
          class="min-h-8 inline-flex items-center gap-1 rounded-full pr-1 hover:bg-slate-100 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
          [attr.aria-expanded]="menuAbierto()"
          aria-haspopup="menu"
          aria-label="Menú de usuario"
        >
          <span class="w-9 h-9 rounded-full overflow-hidden bg-primary-100 text-primary-700 font-bold text-sm flex items-center justify-center">
            @if (profile()?.logo_url) {
              <img [src]="profile()!.logo_url" [alt]="displayName()" class="w-full h-full object-cover" />
            } @else {
              {{ initials() }}
            }
          </span>
          <lucide-icon name="chevron-down" [size]="16" class="text-slate-500" />
        </button>

        @if (menuAbierto()) {
          <div
            role="menu"
            class="absolute right-0 mt-2 w-64 rounded-xl bg-white shadow-lg ring-1 ring-black/5 py-2 z-50"
          >
            <div class="px-4 py-3 border-b border-slate-100 min-w-0">
              <p class="text-sm font-semibold text-slate-800 truncate">{{ displayName() }}</p>
              @if (profile()?.nombre_consultorio) {
                <p class="text-xs text-primary-600 truncate">{{ profile()!.nombre_consultorio }}</p>
              }
              @if (email()) {
                <p class="text-xs text-slate-400 truncate">{{ email() }}</p>
              }
            </div>
            <div class="py-1">
              <a routerLink="/perfil" (click)="closeMenu()" role="menuitem"
                 class="flex items-center gap-3 px-4 min-h-8 text-sm text-slate-700 hover:bg-slate-50 focus-visible:bg-slate-50 focus:outline-none">
                <lucide-icon name="circle-user" [size]="18" class="text-slate-400" />
                Mi perfil
              </a>
              <a routerLink="/configuracion/eps" (click)="closeMenu()" role="menuitem"
                 class="flex items-center gap-3 px-4 min-h-8 text-sm text-slate-700 hover:bg-slate-50 focus-visible:bg-slate-50 focus:outline-none">
                <lucide-icon name="settings" [size]="18" class="text-slate-400" />
                Configuración
              </a>
              <button type="button" (click)="logout()" role="menuitem"
                 class="w-full flex items-center gap-3 px-4 min-h-8 text-sm text-red-600 hover:bg-red-50 focus-visible:bg-red-50 focus:outline-none">
                <lucide-icon name="log-out" [size]="18" />
                Cerrar sesión
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
