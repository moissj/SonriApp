<div class="relative w-full">
  <label [for]="inputId" class="block text-xs font-semibold text-gray-600 mb-1">{{ label() }}</label>
  <div class="flex items-center gap-1.5">
    <input
      [id]="inputId"
      type="text"
      autocomplete="off"
      [formControl]="searchControl"
      [placeholder]="placeholder()"
      class="w-full px-2.5 py-1.5 min-h-9 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-500"
    />
    @if (seleccionado() || searchControl.value) {
      <button type="button" (click)="limpiar()" aria-label="Limpiar código"
        class="shrink-0 text-xs font-semibold text-red-600 hover:underline px-1.5 py-1">Limpiar</button>
    }
  </div>

  @if (error()) {
    <p class="text-xs text-red-600 mt-1" role="alert">{{ error() }}</p>
  }

  @if (resultados().length > 0) {
    <ul class="absolute z-20 w-full bg-white border border-gray-200 rounded-lg mt-1 max-h-48 overflow-y-auto divide-y divide-gray-100 shadow-lg" role="listbox">
      @for (r of resultados(); track r.codigo) {
        <li role="option" tabindex="0" (click)="seleccionar(r)" (keydown.enter)="seleccionar(r)"
          class="px-2.5 py-1.5 hover:bg-gray-50 cursor-pointer text-sm">{{ etiqueta(r) }}</li>
      }
    </ul>
  }
</div>
