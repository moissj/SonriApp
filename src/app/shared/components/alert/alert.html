<div [class]="wrapperClass" role="alert">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-5 w-5 shrink-0 mt-0.5"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="iconPath" />
  </svg>

  <span class="flex-1 leading-relaxed">{{ message }}</span>

  @if (dismissible) {
    <button
      type="button"
      (click)="dismiss()"
      class="shrink-0 opacity-60 hover:opacity-100 focus:outline-none transition-opacity"
      aria-label="Cerrar"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  }
</div>
