<dialog #dialogRef class="backdrop:bg-black/50 p-0 bg-transparent border-none outline-none focus:outline-none overflow-visible max-w-lg w-full">
  <div class="rounded-2xl border border-neutral-200 shadow-2xl bg-white max-h-[92vh] flex flex-col overflow-hidden w-full">
    <!-- Cabecera Fija -->
  <header class="px-5 py-3.5 border-b border-neutral-100 flex items-center justify-between bg-neutral-50/80 shrink-0">
    <h3 class="text-base font-bold text-neutral-900">
      {{ isEditing() ? 'Editar Cita' : 'Nueva Cita' }}
    </h3>
    <button type="button" (click)="close()" aria-label="Cerrar" class="min-h-10 min-w-10 text-neutral-450 hover:text-neutral-600 text-xl font-bold leading-none">&times;</button>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col flex-1 overflow-hidden">
    <div class="p-5 space-y-3.5 overflow-y-auto flex-1 custom-modal-scroll">

      <!-- Paciente -->
      <div>
        <label class="block text-[11px] font-bold text-neutral-600 uppercase tracking-wider mb-1.5">Paciente</label>
        <app-patient-autocomplete #patientAutocomplete (pacienteSeleccionado)="onPacienteSeleccionado($event)"></app-patient-autocomplete>
      </div>

      <!-- Tratamiento (antes que duración: la autocompleta) -->
      <div>
        <label for="cita-tratamiento" class="block text-[11px] font-bold text-neutral-600 uppercase tracking-wider mb-1.5">Tratamiento</label>
        <select
          id="cita-tratamiento"
          formControlName="tipo_tratamiento"
          (change)="onTipoChange($any($event.target).value)"
          class="w-full min-h-10 px-3.5 py-2 border border-neutral-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 cursor-pointer"
        >
          <option value="" disabled>Selecciona un tratamiento</option>
          @if (form.controls.tipo_tratamiento.value && !existeEnCatalogo(form.controls.tipo_tratamiento.value)) {
            <option [value]="form.controls.tipo_tratamiento.value">{{ form.controls.tipo_tratamiento.value }} (personalizado)</option>
          }
          @for (t of tratamientos(); track t.id) {
            <option [value]="t.nombre">{{ t.nombre }} · {{ t.precio_base | copCurrency }}</option>
          }
        </select>
        @if (tratamientos().length === 0) {
          <p class="text-xxs text-neutral-400 mt-1">Aún no tienes tratamientos en el catálogo.</p>
        }
      </div>

      <!-- Fecha y Hora -->
      <div>
        <label for="cita-fecha" class="block text-[11px] font-bold text-neutral-600 uppercase tracking-wider mb-1.5">Fecha y Hora</label>
        <input id="cita-fecha" type="datetime-local" formControlName="fecha_hora" class="w-full min-h-10 px-3.5 py-2 border border-neutral-300 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 bg-white">
      </div>

      <!-- Duración (chips) -->
      <div>
        <span class="block text-[11px] font-bold text-neutral-600 uppercase tracking-wider mb-1.5">Duración</span>
        <app-segmented-control
          ariaLabel="Duración de la cita en minutos"
          [opciones]="opcionesDuracion()"
          [valor]="form.controls.duracion_minutos.value"
          (valorChange)="setDuracion($event)" />
      </div>

      <!-- Notas -->
      <div>
        <label for="cita-notas" class="block text-[11px] font-bold text-neutral-600 uppercase tracking-wider mb-1.5">Notas / Comentarios</label>
        <textarea id="cita-notas" formControlName="notas" rows="2" placeholder="Notas adicionales sobre la consulta..." class="w-full px-3.5 py-2 border border-neutral-300 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 bg-white resize-none"></textarea>
      </div>

      <!-- Opciones avanzadas (cerrado por defecto) -->
      <details class="group rounded-xl border border-neutral-200">
        <summary class="min-h-10 flex items-center px-3.5 text-xs font-semibold text-neutral-600 cursor-pointer select-none">Opciones avanzadas</summary>
        <div class="grid grid-cols-2 gap-3.5 p-3.5 pt-1">
          <div>
            <label for="cita-estado" class="block text-[11px] font-bold text-neutral-600 uppercase tracking-wider mb-1.5">Estado</label>
            <select id="cita-estado" formControlName="estado" class="w-full min-h-10 px-3.5 py-2 border border-neutral-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 cursor-pointer">
              <option value="pendiente">Pendiente</option>
              <option value="confirmada">Confirmada</option>
              <option value="atendida">Atendida</option>
              <option value="cancelada">Cancelada</option>
              <option value="no_asistio">No asistió</option>
            </select>
          </div>
          <div>
            <label for="cita-canal" class="block text-[11px] font-bold text-neutral-600 uppercase tracking-wider mb-1.5">Canal de Registro</label>
            <select id="cita-canal" formControlName="canal_origen" class="w-full min-h-10 px-3.5 py-2 border border-neutral-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 cursor-pointer">
              <option value="manual">Manual</option>
              <option value="whatsapp">WhatsApp</option>
              <option value="portal">Portal</option>
            </select>
          </div>
        </div>
      </details>

      <!-- Alerta de Solapamiento -->
      @if (overlapCitas().length > 0) {
        <app-alert type="warning" [message]="overlapWarningMessage()"></app-alert>
      }

      <!-- Alerta de Error Base de Datos -->
      @if (errorMessage()) {
        <app-alert type="error" [message]="errorMessage()"></app-alert>
      }
    </div>

    <!-- Acciones Fijas al Pie -->
    <div class="flex justify-end items-center gap-3 px-5 py-3.5 border-t border-neutral-100 bg-neutral-50/80 shrink-0">
      @if (isEditing()) {
        <button type="button" (click)="onDelete()" class="min-h-10 px-4 py-2 rounded-xl bg-red-50 text-red-650 hover:bg-red-100 font-semibold text-xs transition-colors mr-auto shadow-3xs active:scale-95">
          Eliminar
        </button>
      }
      @if (faltaTexto()) {
        <span class="text-xs text-neutral-500 text-right" role="status">{{ faltaTexto() }}</span>
      }
      <button type="button" (click)="close()" class="min-h-10 px-4 py-2 rounded-xl bg-white hover:bg-neutral-100 border border-neutral-200 text-neutral-700 font-semibold text-xs transition-colors shadow-3xs active:scale-95">
        Cancelar
      </button>
      <span [attr.title]="faltaTexto() || null">
        <app-button type="submit" [loading]="guardando()" [disabled]="guardando() || faltantes().length > 0">Guardar</app-button>
      </span>
    </div>
  </form>
</div>
</dialog>

<app-confirm-modal
  #confirmModal
  title="Eliminar Cita"
  message="¿Estás seguro de que deseas eliminar esta cita? Esta acción no se puede deshacer."
  confirmText="Eliminar"
  cancelText="Cancelar"
  (confirm)="onConfirmDelete()">
</app-confirm-modal>
