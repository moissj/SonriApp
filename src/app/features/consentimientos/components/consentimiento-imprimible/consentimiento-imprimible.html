<article class="imprimible rounded-xl border border-neutral-200 bg-white p-6">
  <h2 class="text-xl font-bold text-neutral-900">{{ titulo() }}</h2>
  <p class="mt-2 text-sm text-neutral-700">
    Paciente: <strong>{{ pacienteHeader().nombre }}</strong> · Documento: {{ pacienteHeader().documento }}
  </p>
  <div class="mt-4 whitespace-pre-line text-sm leading-relaxed text-neutral-800">{{ cuerpo() }}</div>
  <div class="mt-16 grid grid-cols-2 gap-8 text-sm text-neutral-700">
    <div class="border-t border-neutral-900 pt-1">Firma del paciente / acudiente</div>
    <div class="border-t border-neutral-900 pt-1">Firma del odontólogo</div>
  </div>
</article>
