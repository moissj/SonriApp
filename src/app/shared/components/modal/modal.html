<dialog
  #dialogRef
  class="backdrop:bg-black/50 p-0 rounded-2xl border border-neutral-200 shadow-2xl max-w-sm w-[calc(100%-2rem)] bg-white overflow-hidden focus:outline-none"
>
  <div class="flex items-center justify-between px-5 py-4 border-b border-neutral-100">
    <h3 class="text-base font-bold text-neutral-900">{{ title() }}</h3>
    <button
      type="button"
      (click)="close()"
      class="text-neutral-400 hover:text-neutral-600 transition-colors"
      aria-label="Cerrar"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <div class="p-5">
    <ng-content></ng-content>
  </div>
</dialog>
