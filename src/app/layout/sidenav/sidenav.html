<aside
  class="hidden md:flex flex-col bg-white border-r border-gray-100 shrink-0 sticky top-0 h-screen overflow-y-auto overflow-x-hidden transition-[width] duration-300 ease-in-out"
  [class.w-60]="!collapsed()"
  [class.w-20]="collapsed()"
>
  <!-- Logo -->
  <div
    class="flex items-center gap-2 px-5 py-5 border-b border-gray-100 h-[68px]"
    [class.justify-center]="collapsed()"
    [class.px-0]="collapsed()"
  >
    <img src="icons/icon-64.png" alt="SonriApp" class="h-8 w-8 shrink-0 object-contain" />
    @if (!collapsed()) {
      <span class="font-bold text-xl text-sky-700 tracking-tight whitespace-nowrap">SonriApp</span>
    }
  </div>

  <!-- Navegación principal -->
  <nav class="flex-1 px-3 py-4 space-y-1" aria-label="Menú principal">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        routerLinkActive="bg-sky-50 text-sky-700 font-semibold"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-sky-600 transition-colors text-sm"
        [class.justify-center]="collapsed()"
        [attr.title]="collapsed() ? item.label : null"
        [attr.aria-label]="item.label"
      >
        <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
        @if (!collapsed()) {
          <span class="whitespace-nowrap">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Pie del sidenav -->
  <div class="px-4 py-4 border-t border-gray-100">
    <p class="text-xs text-gray-400 text-center whitespace-nowrap">
      {{ collapsed() ? 'v2.0' : 'SonriApp v2.0' }}
    </p>
  </div>
</aside>
