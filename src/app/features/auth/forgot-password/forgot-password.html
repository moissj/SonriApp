<div class="min-h-screen bg-gradient-to-br from-sky-50 to-white flex items-center justify-center px-4 py-6 sm:py-8">
  <div class="w-full max-w-sm">

    <!-- Volver -->
    <div class="mb-5">
      <a
        routerLink="/auth/login"
        class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Volver al inicio de sesión
      </a>
    </div>

    <!-- Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-sky-100 rounded-2xl mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-800">Recuperar contraseña</h1>
      <p class="text-sm text-gray-500 mt-1">Te enviaremos un enlace a tu correo</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-5">

      @if (emailSent()) {

        <app-alert
          message="¡Listo! Revisa tu bandeja de entrada y sigue las instrucciones del correo que te enviamos."
          type="success"
        />

        <a
          routerLink="/auth/login"
          class="flex w-full items-center justify-center gap-2 font-semibold rounded-xl text-base px-5 py-3 bg-white text-sky-700 border border-sky-300 hover:bg-sky-50 transition-all"
        >
          Volver al inicio de sesión
        </a>

      } @else {

        @if (serverError()) {
          <app-alert
            [message]="serverError()"
            type="error"
            [dismissible]="true"
            (dismissed)="serverError.set('')"
          />
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">

          <app-input
            id="fp-email"
            label="Correo electrónico"
            type="email"
            placeholder="tu@correo.com"
            autocomplete="email"
            formControlName="email"
            [error]="emailError"
            hint="Usa el correo con el que te registraste en SonriApp."
          />

          <app-button type="submit" variant="primary" [fullWidth]="true" [loading]="loading()">
            Enviar enlace de recuperación
          </app-button>

        </form>

      }

    </div>

  </div>
</div>
