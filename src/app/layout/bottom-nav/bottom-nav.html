<!-- Hoja inferior "Más" -->
@if (sheetOpen()) {
  <div class="fixed inset-0 z-50 md:hidden bg-black/40 backdrop-blur-xs" (click)="closeSheet()">
    <div
      class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-2xl p-2 pb-[calc(env(safe-area-inset-bottom)+0.5rem)] animate-slide-up"
      (click)="$event.stopPropagation()"
    >
      <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto my-2"></div>
      <div class="py-1">
        @for (item of masItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="text-sky-700 bg-sky-50"
            (click)="closeSheet()"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-50 transition-colors text-sm font-medium"
          >
            <svg class="h-5 w-5 shrink-0 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
            </svg>
            {{ item.label }}
          </a>
        }

        @if (isSuperAdmin()) {
          <a
            routerLink="/admin"
            routerLinkActive="text-sky-700 bg-sky-50"
            (click)="closeSheet()"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-50 transition-colors text-sm font-medium"
          >
            <svg class="h-5 w-5 shrink-0 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="adminIcon" />
            </svg>
            Administración
          </a>
        }

        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 transition-colors text-sm font-medium"
        >
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
}

<!-- Navegación inferior — solo visible en móvil (md:hidden) -->
<nav
  class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-gray-200 md:hidden"
  style="padding-bottom: env(safe-area-inset-bottom)"
  aria-label="Navegación principal"
>
  <div class="flex items-center justify-around h-16">
    <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="text-sky-600"
       class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-sky-600 transition-colors px-2 py-2 min-w-[56px]">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-xs font-medium">Inicio</span>
    </a>

    <a routerLink="/citas" routerLinkActive="text-sky-600"
       class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-sky-600 transition-colors px-2 py-2 min-w-[56px]">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span class="text-xs font-medium">Citas</span>
    </a>

    <a routerLink="/pacientes" routerLinkActive="text-sky-600"
       class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-sky-600 transition-colors px-2 py-2 min-w-[56px]">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span class="text-xs font-medium">Pacientes</span>
    </a>

    <a routerLink="/historial" routerLinkActive="text-sky-600"
       class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-sky-600 transition-colors px-2 py-2 min-w-[56px]">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span class="text-xs font-medium">Historial</span>
    </a>

    <!-- Más: abre la hoja con el resto de secciones -->
    <button type="button" (click)="toggleSheet()"
       [class.text-sky-600]="sheetOpen()"
       class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-sky-600 transition-colors px-2 py-2 min-w-[56px]">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span class="text-xs font-medium">Más</span>
    </button>
  </div>
</nav>
