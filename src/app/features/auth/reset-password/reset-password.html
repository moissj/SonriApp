<div class="min-h-screen bg-gradient-to-br from-sky-50 to-white flex items-center justify-center px-4 py-6 sm:py-8">
  <div class="w-full max-w-sm">

    <!-- Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-sky-600 rounded-2xl mb-4 shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-800">Definir contraseña</h1>
      <p class="text-sm text-gray-500 mt-1">Crea una contraseña para tu cuenta de SonriApp</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-5">

      @if (done()) {
        <app-alert type="success" message="¡Tu contraseña se actualizó correctamente!" />
        <app-button variant="primary" [fullWidth]="true" (click)="goToLogin()">
          Ir a iniciar sesión
        </app-button>
      } @else {
        @if (serverError()) {
          <app-alert
            [message]="serverError()"
            type="error"
            [dismissible]="true"
            (dismissed)="serverError.set('')"
          />
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
          <app-input
            id="password"
            label="Nueva contraseña"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            formControlName="password"
            [error]="fieldError('password')"
          />
          <app-input
            id="confirm"
            label="Confirmar contraseña"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            formControlName="confirm"
            [error]="fieldError('confirm')"
          />
          <app-button type="submit" variant="primary" [fullWidth]="true" [loading]="loading()">
            Guardar contraseña
          </app-button>
        </form>
      }
    </div>

  </div>
</div>
